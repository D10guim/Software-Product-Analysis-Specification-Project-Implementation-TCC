<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja Camisa 10 - Vitrine</title>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8f9fa; margin: 0; padding: 20px; }
        header { text-align: center; padding: 40px 0; background: #1a73e8; color: white; border-radius: 0 0 20px 20px; margin: -20px -20px 30px -20px; }
        
        .vitrine { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; max-width: 1200px; margin: auto;  }
        .card-produto { background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05);  transition: transform 0.3s; display: flex; flex-direction: column; }
        .card-produto:hover { transform: translateY(-5px); }
        .card-produto img { width: 100%; height: 250px; object-fit: cover; }

        .info { padding: 20px; text-align: center; flex-grow: 1; }
        .info h3 { margin: 10px 0; color: #333; }
        .info .preco { color: #1a73e8; font-size: 22px; font-weight: bold; margin: 10px 0; }
        
        .btn-avaliar { background: #ffc107; color: #000; border: none; padding: 12px; width: 100%; cursor: pointer; font-weight: bold; transition: background 0.3s; }
        .btn-avaliar:hover { background: #e0a800; }

        .tag-nota { position: absolute; top: 10px; left: 10px; background: rgba(0, 0, 0, 0.75); color: #ffc107; padding: 5px 10px; border-radius: 20px; font-size: 13px; font-weight: bold; display: flex; align-items: center; gap: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); z-index: 10;}

        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); }
        .modal-content { background: white; margin: 10% auto; padding: 30px; border-radius: 15px; width: 90%; max-width: 400px; text-align: center; }
        .modal-content input, .modal-content textarea { width: 100%; margin-bottom: 15px; padding: 10px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 8px; }
    </style>
</head>
<body>

<script src="auth_header.js"></script>

<header>
    <h1>Camisa 10 - Oficial</h1>
    <p>As melhores camisas de time direto para você</p>
</header>

<div class="vitrine" id="vitrine"></div>

<div id="modalAvaliacao" class="modal">
    <div class="modal-content">
        <h3>Avaliar Produto</h3>
        <input type="hidden" id="idCamisaAvaliar">
        <input type="text" id="nomeCliente" placeholder="Seu Nome">
        <input type="number" id="notaCliente" placeholder="Nota (1 a 5)" min="1" max="5">
        <textarea id="comentarioCliente" placeholder="O que achou do produto?"></textarea>
        <button onclick="enviarAvaliacao()" style="background: #28a745; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer;">Enviar Avaliação</button>
        <button onclick="fecharModal()" style="background: #666; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin-left: 10px;">Cancelar</button>
    </div>
</div>

<script>
    const API_URL = "http://127.0.0.1:5000/camisas";

    window.onload = carregarProdutos;

    async function carregarProdutos() {
        try {
            const res = await fetch(API_URL);
            const camisas = await res.json();
            const vitrine = document.getElementById('vitrine');
            vitrine.innerHTML = "";

            console.log("Dados recebidos do Flask:", camisas);

            camisas.forEach(c => {
                const urlImagem = c.imagem_url || c.imagem || 'https://picsum.photos/250';

                const notaBruta = c.media_nota !== undefined ? c.media_nota : 
                  (c.nota_media !== undefined ? c.nota_media : 
                  (c.nota !== undefined ? c.nota : 0));
                const notaFixada = Number(notaBruta).toFixed(1);

                vitrine.innerHTML += `
                <div class="card-produto" style="position: relative;">
                    <div class="tag-nota" title="Média de avaliações">
                        ⭐ ${notaFixada}
                    </div>

                    <div onclick="adicionarAoCarrinho(${c.id}, '${c.nome.replace(/'/g, "\\'")}', ${c.preco})" 
                         style="position: absolute; top: 10px; right: 10px; background: white; border-radius: 50%; width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.2); z-index: 10;" title="Adicionar ao Carrinho">
                        🛒
                    </div>

                    <a href="produto_detalhes.html?id=${c.id}" style="text-decoration: none; color: inherit;">
                        <img src="${urlImagem}" alt="${c.nome}">
                        <div class="info">
                            <h3>${c.nome}</h3>
                            <p class="preco">R$ ${Number(c.preco).toFixed(2)}</p>
                        </div>
                    </a>
                    
                    <button class="btn-avaliar" onclick="abrirModal(${c.id})">⭐ Avaliar Produto</button>
                </div>
                `;
            });
        } catch (error) {
            console.error("Erro ao carregar vitrine:", error);
            document.getElementById('vitrine').innerHTML = "<p style='text-align:center; color:red;'>Erro ao carregar os produtos do servidor.</p>";
        }
    }

    function abrirModal(id) {
        document.getElementById('idCamisaAvaliar').value = id;
        document.getElementById('modalAvaliacao').style.display = "block";
    }

    function fecharModal() {
        document.getElementById('modalAvaliacao').style.display = "none";
    }

    async function enviarAvaliacao() {
        const idCamisa = document.getElementById('idCamisaAvaliar').value;
        const nome = document.getElementById('nomeCliente').value;
        const nota = document.getElementById('notaCliente').value;
        const comentario = document.getElementById('comentarioCliente').value;

        if(!nome || !nota) { alert("Por favor, preencha seu nome e a nota."); return; }

        const dados = {
            camisa_id: parseInt(idCamisa),
            nome: nome,
            nota: parseInt(nota),
            comentario: comentario
        };

        try {
            const res = await fetch('http://127.0.0.1:5000/avaliar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dados)
            });

            if (res.ok) {
                alert("Obrigado! Sua avaliação foi salva.");
                fecharModal();
                location.reload();
            } else {
                alert("Erro ao enviar avaliação.");
            }
        } catch (error) {
            alert("Servidor desligado!");
        }
    }

    function adicionarAoCarrinho(id, nome, preco) {
        alert(`Camisa ${nome} adicionada ao carrinho!`);
        
        let carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];
        const itemExistente = carrinho.find(i => i.camisa_id === id && i.tamanho === 'M');

        if (itemExistente) {
            itemExistente.quantidade += 1;
        } else {
            carrinho.push({
                camisa_id: id,
                name: nome,
                preco: parseFloat(preco),
                tamanho: 'M',
                quantidade: 1
            });
        }
        localStorage.setItem('carrinho', JSON.stringify(carrinho));
    }
</script>
</body>
</html>
