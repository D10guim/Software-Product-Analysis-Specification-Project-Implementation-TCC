<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Portal Camisa 10</title>
    <style>
        body { font-family: 'Inter', sans-serif; background: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;}
        .portal-container { text-align: center; }
        .options { display: flex; gap: 30px; margin-top: 40px; }
        .card { background: white; padding: 40px; border-radius: 20px; width: 250px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); cursor: pointer; transition: transform 0.3s ease, box-shadow 0.3s ease; text-decoration: none; color: #333; }
        .card:hover {transform: translateY(-10px); box-shadow: 0 15px 35px rgba(26, 115, 232, 0.2); }
        .card i { font-size: 50px; color: #1a73e8; margin-bottom: 20px; display: block; }
        .card h3 { margin: 0; font-size: 22px; }
        .card p { color: #666; font-size: 14px; margin-top: 10px; }
        
        .bg-admin { border-top: 5px solid #1a73e8; }
        .bg-client { border-top: 5px solid #28a745; }
    </style>
</head>
<body>

<div class="portal-container">
    <h1>Bem-vindo à Camisa 10</h1>
    <p>Selecione como deseja acessar o sistema:</p>

    <div class="options">
        <a href="login.html" class="card bg-admin">
            <i>📦</i>
            <h3>Distribuidor</h3>
            <p>Gestão de estoque, preços e novos modelos.</p>
        </a>

        <a href="cliente.html" class="card bg-client">
            <i>🛒</i>
            <h3>Cliente</h3>
            <p>Visualizar modelos disponíveis e comprar.</p>
        </a>
    </div>
</div>

</body>
</html>
