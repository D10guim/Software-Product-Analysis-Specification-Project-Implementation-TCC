<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Meu Carrinho - Camisa 10</title>
    <style>
        body { font-family: 'Inter', sans-serif; background: #f4f7f6; padding: 40px; margin: 0; }
        .container-carrinho { max-width: 1100px; margin: auto; display: flex; gap: 30px; }
        
        .secao-itens { flex: 2; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .secao-itens h2 { margin-top: 0; color: #333; border-bottom: 2px solid #f4f7f6; padding-bottom: 15px; }
        
        .item-carrinho { display: flex; align-items: center; justify-content: space-between; padding: 20px 0; border-bottom: 1px solid #eee; }
        .item-info { display: flex; align-items: center; gap: 20px; }
        .item-detalhes h4 { margin: 0 0 5px 0; color: #333; font-size: 18px; }
        .item-detalhes p { margin: 0; color: #777; font-size: 14px; }
        
        .quantidade-container { display: flex; align-items: center; gap: 10px; }
        .btn-qtd { background: #eee; border: none; width: 30px; height: 30px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 16px; }
        .btn-qtd:hover { background: #ddd; }
        .qtd-valor { font-weight: bold; width: 20px; text-align: center; }

        .preco-item { font-weight: bold; color: #1a73e8; font-size: 18px; min-width: 100px; text-align: right; }
        .btn-remover { background: none; border: none; color: #dc3545; cursor: pointer; font-weight: bold; margin-left: 20px; }
        .btn-remover:hover { text-decoration: underline; }

        .secao-resumo { flex: 1; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); height: fit-content; }
        .secao-resumo h3 { margin-top: 0; color: #333; border-bottom: 2px solid #f4f7f6; padding-bottom: 15px; }
        
        .linha-resumo { display: flex; justify-content: space-between; margin: 15px 0; color: #555; }
        .linha-resumo.total { font-size: 20px; font-weight: bold; color: #333; border-top: 2px solid #f4f7f6; padding-top: 15px; }
        
        .btn-finalizar { background: #28a745; color: white; border: none; padding: 16px; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 20px; transition: 0.3s; }
        .btn-finalizar:hover { background: #218838; }
        
        .btn-continuar { background: none; border: 1px solid #1a73e8; color: #1a73e8; padding: 12px; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; transition: 0.2s; }
        .btn-continuar:hover { background: #1a73e8; color: white; }

        .frete-container { margin-top: 20px; padding-top: 15px; border-top: 1px dashed #ddd; }
        .frete-container input { padding: 10px; border: 1px solid #ddd; border-radius: 8px; width: 60%; box-sizing: border-box; }
        .frete-container button { padding: 10px; background: #1a73e8; color: white; border: none; border-radius: 8px; cursor: pointer; width: 35%; margin-left: 3%; }
    </style>
</head>
<body>

<script src="auth_header.js"></script>

<div class="container-carrinho">
    <div class="secao-itens">
        <h2>Seu Carrinho</h2>
        <div id="lista-produtos-carrinho">
            </div>
    </div>

    <div class="secao-resumo">
        <h3>Resumo do Pedido</h3>
        <div class="linha-resumo">
            <span>Subtotal</span>
            <span id="resumo-subtotal">R$ 0,00</span>
        </div>
        <div class="linha-resumo">
            <span>Frete</span>
            <span id="resumo-frete">R$ 0,00</span>
        </div>
        
        <div class="frete-container">
            <input type="text" id="cep-input" placeholder="Digite seu CEP" maxlength="9">
            <button onclick="calcularFreteSimulado()">Calcular</button>
        </div>

        <div class="linha-resumo total">
            <span>Total</span>
            <span id="resumo-total">R$ 0,00</span>
        </div>

        <button class="btn-finalizar" onclick="prosseguirParaPagamento()">Fechar Pedido</button>
        <button class="btn-continuar" onclick="window.location.href='cliente.html'">Continuar Comprando</button>
    </div>
</div>

<script>
    let carrinho = [];
    let valorFrete = 0;

    function carregarCarrinho() {
        const dadosLocais = localStorage.getItem('carrinho');
        
        if (dadosLocais) {
            carrinho = JSON.parse(dadosLocais);
        }

        renderizarCarrinho();
    }

    function renderizarCarrinho() {
        const container = document.getElementById('lista-produtos-carrinho');
        
        if (carrinho.length === 0) {
            container.innerHTML = `<p style="color: #888; text-align: center; padding: 40px 0;">Seu carrinho está vazio.</p>`;
            atualizarResumo();
            return;
        }

        container.innerHTML = carrinho.map((item, index) => `
            <div class="item-carrinho">
                <div class="item-info">
                    <div class="item-detalhes">
                        <h4>${item.nome}</h4>
                        <p>Tamanho: <b>${item.tamanho}</b></p>
                    </div>
                </div>
                
                <div class="quantidade-container">
                    <button class="btn-qtd" onclick="alterarQuantidade(${index}, -1)">-</button>
                    <span class="qtd-valor">${item.quantidade}</span>
                    <button class="btn-qtd" onclick="alterarQuantidade(${index}, 1)">+</button>
                </div>

                <div class="preco-item">
                    R$ ${(Number(item.preco) * item.quantidade).toFixed(2)}
                </div>

                <button class="btn-remover" onclick="removerItem(${index})">Remover</button>
            </div>
        `).join('');

        atualizarResumo();
    }

    function alterarQuantidade(index, mudanca) {
        carrinho[index].quantidade += mudanca;

        if (carrinho[index].quantidade <= 0) {
            removerItem(index);
            return;
        }

        salvarAtualizacao();
    }

    function removerItem(index) {
        carrinho.splice(index, 1);
        salvarAtualizacao();
    }

    function salvarAtualizacao() {
        localStorage.setItem('carrinho', JSON.stringify(carrinho));
        renderizarCarrinho();
    }

    function atualizarResumo() {
        const subtotal = carrinho.reduce((total, item) => total + (Number(item.preco) * item.quantidade), 0);
        const total geral = subtotal + valorFrete;

        document.getElementById('resumo-subtotal').innerText = `R$ ${subtotal.toFixed(2)}`;
        document.getElementById('resumo-frete').innerText = valorFrete === 0 ? "Grátis" : `R$ ${valorFrete.toFixed(2)}`;
        document.getElementById('resumo-total').innerText = `R$ ${totalgeral.toFixed(2)}`;
    }

    function calcularFreteSimulado() {
        const cep = document.getElementById('cep-input').value.trim();

            return;
        }

    function prosseguirParaPagamento() {
        const clienteId = localStorage.getItem('cliente_id');

        if (carrinho.length === 0) {
            alert("Seu carrinho está vazio! Adicione algum produto antes de fechar o pedido.");
            return;
        }

        if (!clienteId || clienteId === "null" || clienteId === "undefined" || clienteId.trim() === "") {
            alert("Atenção: Você precisa entrar na sua conta ou criar uma para fechar o pedido!");
            window.location.href = "cadastro_de_login_cliente.html";
            return;
        }

        window.location.href = "pagamento.html";
    }

    window.onload = carregarCarrinho;
</script>
</body>
</html>
