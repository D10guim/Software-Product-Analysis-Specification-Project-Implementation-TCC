<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Camisa 10 - Admin</title>
    <style> 
        body { font-family: 'Segoe UI', sans-serif; margin: 30px; background: #f4f7f6; }
        .container { max-width: 900px; margin: auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); }
        
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        input, select, textarea { padding: 10px; border: 1px solid #ddd; border-radius: 5px; font-family: inherit; }
        
        .search-box { width: 100%; padding: 12px; border: 2px solid #1a73e8; border-radius: 8px; font-size: 16px; box-sizing: border-box; margin-bottom: 10px; outline: none; }
        
        button { background: #1a73e8; color: white; border: none; padding: 12px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { opacity: 0.9; }

        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border-bottom: 1px solid #eee; text-align: left; }
        .img-preview { width: 50px; height: 50px; object-fit: cover; border-radius: 5px; }
        
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; display: inline-block; margin: 2px; text-transform: uppercase; }
        .badge-p { background: #e1f5fe; color: #01579b; } 
        .badge-m { background: #e7e9eb; color: #5f1604; }
        .badge-g { background: #fff3e0; color: #e65100; } 
        .badge-gg { background: #cae4f0; color: #ee190a; }
    </style>
</head>
<body>

<div class="container">
    <h2>📦 Gestão de Estoque de Camisas</h2>

    <div class="controls">
        <input type="text" id="nome" placeholder="Modelo da Camisa">
        <input type="number" id="preco" placeholder="Preço R$" step="0.01">
        
        <textarea id="descricao" placeholder="Descrição detalhada da camisa..." style="grid-column: span 2; height: 80px;"></textarea>

        <input type="number" id="qtd_p" placeholder="Qtd P">
        <input type="number" id="qtd_m" placeholder="Qtd M">
        <input type="number" id="qtd_g" placeholder="Qtd G">
        <input type="number" id="qtd_gg" placeholder="Qtd GG">
        
        <div style="grid-column: span 2;">
            <label><strong>Fotos do Produto (Selecione uma ou mais):</strong></label><br>
            <input type="file" id="foto_input" multiple accept="image/*" style="margin-top: 10px;">
        </div>
        
        <button onclick="cadastrarCamisa()" style="grid-column: span 2;">Cadastrar no Estoque</button>
    </div>

    <hr>

    <div style="margin-top: 20px;">
        <input type="text" id="filtroNome" class="search-box" placeholder="🔍 Filtrar por modelo de camisa..." onkeyup="filtrarTabela()">
    </div>

    <table id="tabela-camisas">
        <thead>
            <tr>
                <th>Foto</th>
                <th>Modelo</th>
                <th>Estoque</th>
                <th>Preço</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="tabela-corpo"></tbody>
    </table>
</div>

<script>
    const API_URL = 'http://127.0.0.1:5000/camisas';

    async function listarCamisas() {
        try {
            const res = await fetch(API_URL);
            const camisas = await res.json();
            const corpo = document.getElementById('tabela-corpo');
            corpo.innerHTML = '';

            camisas.forEach(c => {
                corpo.innerHTML += `
                    <tr>
                        <td><img src="${c.imagem}" class="img-preview" onerror="this.src='https://via.placeholder.com/50'"></td>
                        <td>${c.nome}</td>
                        <td>
                            <span class="badge badge-p">P: ${c.qtd_p}</span>
                            <span class="badge badge-m">M: ${c.qtd_m}</span>
                            <span class="badge badge-g">G: ${c.qtd_g}</span>
                            <span class="badge badge-gg">GG: ${c.qtd_gg}</span>
                        </td>
                        <td>R$ ${parseFloat(c.preco).toFixed(2)}</td>
                        <td>
                            <button onclick="window.location.href='editar_produto.html?id=${c.id}'">✏️</button>
                            <button onclick="deletarCamisa(${c.id})" style="background:#dc3545;">X</button>
                        </td>
                    </tr>`;
            });
        } catch (error) {
            console.error("Erro ao listar:", error);
        }
    }

    async function cadastrarCamisa() {
        const formData = new FormData();
        

        formData.append('nome', document.getElementById('nome').value);
        formData.append('preco', document.getElementById('preco').value);
        formData.append('descricao', document.getElementById('descricao').value);
        formData.append('qtd_p', document.getElementById('qtd_p').value || 0);
        formData.append('qtd_m', document.getElementById('qtd_m').value || 0);
        formData.append('qtd_g', document.getElementById('qtd_g').value || 0);
        formData.append('qtd_gg', document.getElementById('qtd_gg').value || 0);
        

        const fotoInput = document.getElementById('foto_input');
        for (let i = 0; i < fotoInput.files.length; i++) {
            formData.append('fotos', fotoInput.files[i]);
        }

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                body: formData
            });

            if (response.ok) {
                alert("✅ Camisa cadastrada com sucesso!");
                location.reload(); 
            } else {
                const erro = await response.json();
                alert("Erro: " + erro.erro);
            }
        } catch (error) {
            console.error("Erro na conexão:", error);
        }
    }

    async function deletarCamisa(id) {
        if (confirm("Deseja mesmo excluir este produto?")) {
            const res = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
            if (res.ok) {
                alert("Removido!");
                listarCamisas();
            }
        }
    }

    function filtrarTabela() {
        const termo = document.getElementById('filtroNome').value.toLowerCase();
        const linhas = document.querySelectorAll('#tabela-corpo tr');

        linhas.forEach(linha => {
            const nome = linha.cells[1].textContent.toLowerCase();
            linha.style.display = nome.includes(termo) ? "" : "none";
        });
    }

    window.onload = listarCamisas;
</script>
</body>
</html>
