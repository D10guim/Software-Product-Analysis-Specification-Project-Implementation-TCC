<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Editar Camisa - Camisa 10</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; padding: 40px; }
        .form-edit { background: white; max-width: 600px; margin: auto; padding: 30px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        label { font-weight: bold; display: block; margin-top: 15px; }
        input, textarea { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        
        .galeria-edit { display: flex; flex-wrap: wrap; gap: 10px; background: #fafafa; padding: 15px; border-radius: 10px; border: 1px dashed #ccc; margin: 10px 0; }
        .foto-container { position: relative; width: 100px; height: 100px; }
        .foto-container img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; border: 1px solid #ddd; }
        
        .btn-add { background: #34a853; color: white; padding: 10px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-bottom: 20px; display: inline-block; }
        button { width: 100%; padding: 15px; background: #1a73e8; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .cancelar { background: #666; }

        .btn-remover-foto {position: absolute;top: 2px;right: 2px;background: rgba(255, 0, 0, 0.8);color: white;border: none;border-radius: 50%;width: 22px;height: 22px;cursor: pointer;font-size: 14px;font-weight: bold;display: flex;align-items: center;justify-content: center;}
        .btn-remover-foto:hover { background: red; }

        .aviso-fotos { font-size: 12px; color: #666; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="form-edit">
    <h2>Editar Produto</h2>
    
    <label>Nome da Camisa:</label>
    <input type="text" id="edit_nome">
    
    <label>Descrição:</label>
    <textarea id="edit_descricao"></textarea>

    <label>Preço (R$):</label>
    <input type="number" id="edit_preco" step="0.01">
    
    <label>Estoque por Tamanho:</label>
    <div style="display: flex; gap: 5px;">
        <input type="number" id="edit_p" placeholder="P">
        <input type="number" id="edit_m" placeholder="M">
        <input type="number" id="edit_g" placeholder="G">
        <input type="number" id="edit_gg" placeholder="GG">
    </div>

    <label>Galeria Atual:</label>
    <div id="galeria_atual" class="galeria-edit"></div>

    <label>Adicionar Novas Fotos:</label>
    <p class="aviso-fotos">Selecione mais fotos para incluir na galeria deste produto.</p>
    <label class="btn-add" for="novas_fotos">➕ Selecionar Imagens</label>
    <input type="file" id="novas_fotos" multiple accept="image/*" style="display: none;" onchange="previewNovasFotos(this)">
    
    <div id="preview_novas" class="galeria-edit" style="display: none;"></div>

    <button onclick="salvarAlteracoes()">Salvar Todas as Alterações</button>
    <button class="cancelar" onclick="window.location.href='admin.html'">Cancelar</button>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const camisaId = urlParams.get('id');
    let novasFotosArquivos = [];

    window.onload = async () => {
        const res = await fetch(`http://127.0.0.1:5000/camisas`);
        const camisas = await res.json();
        const camisa = camisas.find(c => c.id == camisaId);

        if (camisa) {
            document.getElementById('edit_nome').value = camisa.nome;
            document.getElementById('edit_preco').value = camisa.preco;
            document.getElementById('edit_descricao').value = camisa.descricao || '';
            document.getElementById('edit_p').value = camisa.qtd_p;
            document.getElementById('edit_m').value = camisa.qtd_m;
            document.getElementById('edit_g').value = camisa.qtd_g;
            document.getElementById('edit_gg').value = camisa.qtd_gg;

            const galeria = document.getElementById('galeria_atual');
            galeria.innerHTML = "";

            galeria.innerHTML += `
                <div class="foto-container">
                    <img src="${camisa.imagem}">
                    <span style="position:absolute; bottom:0; background:rgba(0,0,0,0.5); color:white; font-size:10px; width:100%; text-align:center;">CAPA</span>
                </div>`;

            camisa.outras_fotos.forEach(foto => {
                galeria.innerHTML += `
                    <div class="foto-container" id="foto-card-${foto.id}">
                        <img src="${foto.url}">
                        <button class="btn-remover-foto" onclick="apagarFotoBanco(${foto.id})">×</button>
                    </div>`;
            });
        }
    }; 

    async function apagarFotoBanco(fotoId) {
        if (confirm("Deseja excluir esta foto da galeria?")) {
            try {
                const res = await fetch(`http://127.0.0.1:5000/fotos/${fotoId}`, {
                    method: 'DELETE'
                });

                if (res.ok) {
                    const elemento = document.getElementById(`foto-card-${fotoId}`);
                    if (elemento) elemento.remove();
                    alert("Foto removida com sucesso!");
                } else {
                    const erro = await res.json();
                    alert("Erro ao apagar: " + (erro.erro || "Erro desconhecido"));
                }
            } catch (error) {
                console.error("Erro na requisição:", error);
                alert("Não foi possível conectar ao servidor.");
            }
        }
    }

    function previewNovasFotos(input) {
        const previewDiv = document.getElementById('preview_novas');
        previewDiv.style.display = "flex";
        previewDiv.innerHTML = ""; 
        novasFotosArquivos = Array.from(input.files);

        novasFotosArquivos.forEach(file => {
            const reader = new FileReader();
            reader.onload = (e) => {
                previewDiv.innerHTML += `
                    <div class="foto-container">
                        <img src="${e.target.result}" style="border: 2px solid #34a853;">
                    </div>`;
            };
            reader.readAsDataURL(file);
        });
    }

    async function salvarAlteracoes() {
        const formData = new FormData();
        formData.append('nome', document.getElementById('edit_nome').value);
        formData.append('preco', document.getElementById('edit_preco').value);
        formData.append('descricao', document.getElementById('edit_descricao').value);
        formData.append('qtd_p', document.getElementById('edit_p').value);
        formData.append('qtd_m', document.getElementById('edit_m').value);
        formData.append('qtd_g', document.getElementById('edit_g').value);
        formData.append('qtd_gg', document.getElementById('edit_gg').value);
        
        novasFotosArquivos.forEach(file => {
            formData.append('fotos', file);
        });

        const res = await fetch(`http://127.0.0.1:5000/camisas/${camisaId}`, {
            method: 'PUT',
            body: formData
        });

        if (res.ok) {
            alert("✅ Produto atualizado com sucesso!");
            window.location.href = "admin.html";
        } else {
            alert("❌ Erro ao salvar.");
        }
    }
</script>
</body>
</html>
