<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Detalhes do Produto - Camisa 10</title>
    <style>
        body { font-family: 'Inter', sans-serif; background: #f4f7f6; padding: 40px; }
        .container-detalhes { max-width: 1000px; margin: auto; background: white; padding: 30px; border-radius: 20px; display: flex; gap: 40px; }
        .galeria { flex: 1; }
        .foto-principal { width: 100%; border-radius: 15px; }
        .miniaturas { display: flex; gap: 10px; margin-top: 15px; }
        .miniaturas img { width: 80px; height: 80px; object-fit: cover; border-radius: 8px; cursor: pointer; border: 2px solid transparent; }
        .miniaturas img:hover { border-color: #1a73e8; }
        .info-detalhes { flex: 1; }
        .preco { font-size: 28px; color: #1a73e8; font-weight: bold; }
        .btn-comprar { background: #28a745; color: white; padding: 15px 30px; border: none; border-radius: 10px; font-size: 18px; cursor: pointer; width: 100%; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container-detalhes" id="detalhes-produto">
    </div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const id = urlParams.get('id');

    async function carregarDetalhes() {
        const res = await fetch(`http://127.0.0.1:5000/camisas`);
        const camisas = await res.json();
        const c = camisas.find(item => item.id == id);

        if (c) {
            document.getElementById('detalhes-produto').innerHTML = `
                <div class="galeria">
                    <img src="${c.imagem}" class="foto-principal" id="mainImg">
                    <div class="miniaturas">
                        <img src="${c.imagem}" onclick="document.getElementById('mainImg').src='${c.imagem}'">
                        <img src="${c.imagem}" style="filter: grayscale(100%);" title="Mais fotos em breve">
                    </div>
                </div>
                <div class="info-detalhes">
                    <h1>${c.nome}</h1>
                    <p class="preco">R$ ${c.preco.toFixed(2)}</p>
                    <p><strong>Descrição:</strong> ${c.descricao || 'Sem descrição disponível.'}</p>
                    <div style="margin: 20px 0;">
                        <span class="badge">P: ${c.qtd_p}</span> | <span class="badge">M: ${c.qtd_m}</span> |
                        <span class="badge">G: ${c.qtd_g}</span> | <span class="badge">GG: ${c.qtd_gg}</span>
                    </div>
                    <button class="btn-comprar">Finalizar Compra</button>
                    <button onclick="window.history.back()" style="background:none; border:none; color:#666; cursor:pointer; margin-top:10px;">← Voltar</button>
                </div>
            `;
        }
    }
    window.onload = carregarDetalhes;
</script>
</body>
</html>
