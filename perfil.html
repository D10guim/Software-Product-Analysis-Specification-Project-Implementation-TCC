<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Meu Perfil - Camisa 10</title>
    <style>
        body { font-family: 'Inter', sans-serif; background: #f4f7f6; padding: 40px; margin: 0; }
        .container-perfil { max-width: 900px; margin: auto; background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        
        .header-perfil { display: flex; align-items: center; gap: 30px; border-bottom: 2px solid #f4f7f6; padding-bottom: 30px; margin-bottom: 30px; }

        .avatar-container { position: relative; width: 120px; height: 120px; }
        .avatar-img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; border: 3px solid #1a73e8; background: #eee; }
        .btn-upload-foto { position: absolute; bottom: 0; right: 0; background: #1a73e8; color: white; border: none; border-radius: 50%; width: 35px; height: 35px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        #input-foto { display: none; }

        .saudacao h2 { margin: 0 0 5px 0; color: #333; }
        .saudacao p { margin: 0; color: #777; font-size: 14px; }

        .grid-form { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group.full-width { grid-column: span 2; }
        .form-group label { font-weight: bold; font-size: 14px; color: #555; margin-bottom: 8px; }
        .form-group input { padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; outline: none; transition: 0.2s; }
        .form-group input:focus { border-color: #1a73e8; box-shadow: 0 0 5px rgba(26,115,232,0.2); }

        .btn-salvar { background: #1a73e8; color: white; border: none; padding: 14px 30px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px; transition: 0.2s; width: fit-content; }
        .btn-salvar:hover { background: #155cb4; }

        .historico-compras { margin-top: 50px; }
        .historico-compras h3 { border-bottom: 2px solid #f4f7f6; padding-bottom: 10px; color: #333; }
        .compra-card { background: #f9f9f9; border: 1px solid #eee; border-radius: 12px; padding: 20px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .compra-info p { margin: 5px 0; color: #555; font-size: 14px; }
        .status-badge { background: #d4edda; color: #155724; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; text-transform: uppercase; }

        .btn-voltar { background: none; border: none; color: #1a73e8; cursor: pointer; font-weight: bold; margin-bottom: 20px; display: inline-flex; align-items: center; gap: 5px; padding: 0; }
    </style>
</head>
<body>

<div class="container-perfil">
    <button onclick="window.location.href='cliente.html'" class="btn-voltar">← Voltar para a loja</button>

    <div class="header-perfil">
        <div class="avatar-container">
            <img src="https://via.placeholder.com/150" id="foto-usuario" class="avatar-img" alt="Foto de perfil">
            <label for="input-foto" class="btn-upload-foto">📷</label>
            <input type="file" id="input-foto" accept="image/*" onchange="previsualizarFoto(this)">
        </div>
        <div class="saudacao">
            <h2 id="nome-perfil">Carregando...</h2>
            <p>Gerencie seus dados e acompanhe seus pedidos</p>
        </div>
    </div>

    <form id="form-perfil" onsubmit="salvarDadosPerfil(event)">
        <div class="grid-form">
            <div class="form-group full-width">
                <label>Nome Completo</label>
                <input type="text" id="perfil-nome" disabled style="background: #f1f3f4; color: #666;">
            </div>
            <div class="form-group">
                <label>E-mail</label>
                <input type="email" id="perfil-email" required>
            </div>
            <div class="form-group">
                <label>Nova Senha</label>
                <input type="password" id="perfil-senha" placeholder="Digite uma nova senha para alterar">
            </div>
            <div class="form-group">
                <label>Data de Nascimento</label>
                <input type="date" id="perfil-nascimento" required>
            </div>
        </div>
        <button type="submit" class="btn-salvar">Salvar Alterações</button>
    </form>

    <div class="historico-compras">
        <h3>Histórico de Compras</h3>
        <div id="lista-compras">
            <p style="color: #888;">Carregando suas compras...</p>
        </div>
    </div>
</div>

<script>
    const clienteId = localStorage.getItem('cliente_id');

    if (!clienteId || clienteId === "null" || clienteId === "undefined" || clienteId.trim() === "") {
        alert("Sessão expirada ou não identificada. Por favor, faça login.");
        window.location.href = "cadastro_de_login_cliente.html";
    }

    async function carregarDadosPerfil() {
        try {
            const resCliente = await fetch(`http://127.0.0.1:5000/clientes/${clienteId}`);
            if (resCliente.ok) {
                const cliente = await resCliente.json();
                
                document.getElementById('nome-perfil').innerText = `Olá, ${cliente.nome}!`;
                document.getElementById('perfil-nome').value = cliente.nome;
                document.getElementById('perfil-email').value = cliente.email;
                document.getElementById('perfil-nascimento').value = cliente.data_nascimento || "";

                if (cliente.foto) {
                    document.getElementById('foto-usuario').src = cliente.foto;
                }
            }

            const resCompras = await fetch(`http://127.0.0.1:5000/compras/${clienteId}`);
            const listaDiv = document.getElementById('lista-compras');

            if (resCompras.ok) {
                const compras = await resCompras.json();
                if (compras && compras.length > 0) {
                    listaDiv.innerHTML = compras.map(c => `
                        <div class="compra-card">
                            <div class="compra-info">
                                <strong>Pedido #${c.id}</strong>
                                <p><b>Produto:</b> ${c.nome_produto || 'Camisa'} - Tamanho: ${c.tamanho}</p>
                                <p><b>Valor:</b> R$ ${Number(c.preco).toFixed(2)}</p>
                                <p><b>Data:</b> ${new Date(c.data_compra).toLocaleDateString('pt-BR')}</p>
                            </div>
                            <span class="status-badge">${c.status || 'Aprovado'}</span>
                        </div>
                    `).join('');
                } else {
                    listaDiv.innerHTML = "<p style='color: #888;'>Você ainda não realizou nenhuma compra.</p>";
                }
            } else {
                listaDiv.innerHTML = "<p style='color: #888;'>Nenhuma compra encontrada.</p>";
            }

        } catch (error) {
            console.error("Erro ao buscar dados do perfil:", error);
        }
    }

    function previsualizarFoto(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('foto-usuario').src = e.target.result;
            }
            reader.readAsDataURL(input.files[0]);
        }
    }

    async function salvarDadosPerfil(event) {
        event.preventDefault();

        const email = document.getElementById('perfil-email').value;
        const senha = document.getElementById('perfil-senha').value;
        const nascimento = document.getElementById('perfil-nascimento').value;
        const fotoSrc = document.getElementById('foto-usuario').src; 

        const dadosAtualizados = {
            email: email,
            data_nascimento: nascimento,
            foto: fotoSrc 
        };

        if (senha.trim() !== "") {
            dadosAtualizados.senha = senha;
        }

        try {
            const res = await fetch(`http://127.0.0.1:5000/clientes/atualizar/${clienteId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dadosAtualizados)
            });

            if (res.ok) {
                alert("Perfil atualizado com sucesso!");
                location.reload();
            } else {
                const erro = await res.json();
                alert("Erro ao atualizar: " + (erro.error || "Tente novamente"));
            }
        } catch (e) {
            alert("Não foi possível conectar ao servidor.");
        }
    }

    window.onload = carregarDadosPerfil;
</script>
</body>
</html>
